<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Tracker Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #333; }
        #map { height: 500px; }
        .popup-content { max-width: 300px; }
        button { 
            background-color: #4CAF50; 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            cursor: pointer; 
            font-size: 14px; 
            border-radius: 5px; 
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h2>Location Map</h2>
    <div id="map"></div>

    <script>
        // Store fetched locations globally to access in showRecords
        let locationsData = [];

        // Function to show records in a new window, styled like generate_map.py
        function showRecords(index) {
            const record = locationsData[index];
            let recordWindow = window.open('', 'Records', 'width=800,height=600');
            if (recordWindow) {
                recordWindow.focus();
            }
            recordWindow.document.write('<html><head><title>Location Records</title>');
            recordWindow.document.write(`
                <style>
                    table {
                        width: 100%;
                        border-collapse: collapse;
                        margin-top: 20px;
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                        font-size: 14px;
                    }
                    th, td {
                        padding: 12px;
                        text-align: left;
                        border: 1px solid #ddd;
                    }
                    th {
                        background-color: #4CAF50;
                        color: white;
                    }
                    tr:nth-child(even) {
                        background-color: #f2f2f2;
                    }
                    tr:hover {
                        background-color: #ddd;
                    }
                    .record-table {
                        width: 90%;
                        margin: auto;
                        margin-top: 30px;
                        border-radius: 8px;
                        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                    }
                </style>
            `);
            recordWindow.document.write('</head><body><h2>Location Records</h2>');
            let table = '<table class="record-table">';
            table += `<tr style="background-color: #4CAF50; color: white;">
                <th>Google Account</th><th>Address</th><th>Local Time</th><th>Battery Level</th>
                <th>Last Update</th><th>Server Time</th><th>Lat_Long</th>
            </tr>`;
            table += `<tr style="background-color: #f2f2f2;">
                <td>${record.google_account || 'N/A'}</td>
                <td>${record.address || 'N/A'}</td>
                <td>${record.local_time || 'N/A'}</td>
                <td>${record.battery_level || 'N/A'}</td>
                <td>${record.last_update || 'N/A'}</td>
                <td>${record.server_time || 'N/A'}</td>
                <td>${record.latitude},${record.longitude}</td>
            </tr>`;
            table += '</table>';
            recordWindow.document.write(table);
            recordWindow.document.write('</body></html>');
            recordWindow.document.close();
        }

        // Fetch data and generate map
        fetch('/api/locations')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Fetched data:', data);
                if (!data || !Array.isArray(data) || data.length === 0) {
                    alert('No location data available or invalid data format.');
                    return;
                }

                // Store the data globally
                locationsData = data;

                // Initialize the map
                const map = L.map('map').setView([data[0].latitude, data[0].longitude], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);

                // Add markers for all locations
                const locations = [];
                locationsData.forEach((point, idx) => {
                    const lat = point.latitude;
                    const lon = point.longitude;
                    locations.push([lat, lon]);

                    const popupContent = `
                        <div class="popup-content">
                            <b>Google Account:</b> ${point.google_account || 'N/A'}<br>
                            <b>Address:</b> ${point.address || 'N/A'}<br>
                            <b>Lat_Long:</b> ${lat},${lon}<br>
                            <b>Local Time:</b> ${point.local_time || 'N/A'}<br>
                            <b>Battery Level:</b> ${point.battery_level || 'N/A'}<br>
                            <b>Last Update:</b> ${point.last_update || 'N/A'}<br>
                            <b>Server Time:</b> ${point.server_time || 'N/A'}<br>
                            <b>Sri Lanka Time:</b> ${point.sri_lanka_time || 'N/A'}<br>
                            <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Open in Google Maps</a><br>
                            <button id="show-records-${idx}">Show All Records</button>
                        </div>
                    `;

                    // First location: red marker, others: blue circle markers
                    const marker = idx === 0
                        ? L.marker([lat, lon], { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }) })
                        : L.circleMarker([lat, lon], { radius: 5, color: 'blue', fillColor: 'blue', fillOpacity: 0.1 });
                    
                    const popup = L.popup().setContent(popupContent);
                    marker.bindPopup(popup).bindTooltip(`Location ${idx + 1}`).addTo(map);

                    // Add event listener for the button after popup is opened
                    marker.on('popupopen', () => {
                        const button = document.getElementById(`show-records-${idx}`);
                        if (button) {
                            button.onclick = () => showRecords(idx);
                        }
                    });
                });

                // Add polyline
                if (locations.length > 1) {
                    L.polyline(locations, { color: 'blue', weight: 2.5, opacity: 0.7 }).addTo(map);
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                alert(`Failed to load location data. Check the console for details. Error: ${error.message}`);
            });
    </script>
</body>
</html>
